function stock(){$('v').innerHTML='<div class="bar"><button class="'+(seg=='frames'?'':'g')+'" data-c="sg(\'frames\')">Frames</button><button class="'+(seg=='lenses'?'':'g')+'" data-c="sg(\'lenses\')">Lenses</button></div>'
 +'<div class="card">'+(seg=='frames'?'<input id="a1" placeholder="Frame naam/model"><div class="grid"><input id="a2" inputmode="numeric" placeholder="Quantity"><input id="a3" inputmode="numeric" placeholder="Low alert (2)"></div>'
 :'<select id="a1"><option>Single Vision</option><option>Bifocal</option><option>Progressive</option><option>Blue Cut</option><option>Photochromic</option></select><div class="grid"><input id="s1" inputmode="decimal" placeholder="SPH (-2.00)"><input id="s2" inputmode="decimal" placeholder="CYL (-0.50)"><input id="a2" inputmode="numeric" placeholder="Jori quantity"><input id="a3" inputmode="numeric" placeholder="Low alert (2)"></div>')
 +'<button style="width:100%" data-c="addS()">Stock add karein</button></div>'
 +(seg=='lenses'?'<input placeholder="SPH se dhundein (jaise -2)" data-i="qs(this.value)">':'')+'<div id="sl"></div>';st2()}
function st2(){var list=seg=='frames'?db.frames:db.lenses.slice().sort(function(a,b){return N(a.sph)-N(b.sph)||N(a.cyl)-N(b.cyl)});
 if(seg=='lenses'&&q)list=list.filter(function(l){return String(l.sph).indexOf(q)>-1});
 $('sl').innerHTML=list.map(function(x){var lo=N(x.qty)<=N(x.min);return '<div class="card row"><div><b>'+esc(seg=='frames'?x.name:lname(x))+'</b><br><span class="tag '+(lo?'low':'')+'">'+(lo?'LOW: ':'Stock: ')+x.qty+'</span> <span class="m">alert '+x.min+'</span></div><div class="row"><button class="s" data-c="adj(\''+x.id+'\',-1)">-</button><button class="s" data-c="adj(\''+x.id+'\',1)">+</button><button class="s g" data-c="rm(\''+x.id+'\')">x</button></div></div>'}).join('')||'<p class="m">Abhi koi stock nahi.</p>'}
async function addS(){var a=$('a1').value.trim(),qn=N($('a2').value),m=$('a3').value===''?2:N($('a3').value);if(!a)return toast('Naam zaroori');var r;
 if(seg=='frames'){r=await SB.from('frames').insert({name:a,qty:qn,min:m}).select().single();if(bad(r))return;db.frames.push(r.data)}
 else{var s=$('s1').value.trim(),c=$('s2').value.trim();if(s==='')return toast('SPH likhein');
  var ex=db.lenses.find(function(l){return l.type==a&&N(l.sph)==N(s)&&N(l.cyl)==N(c)});
  if(ex){ex.qty=N(ex.qty)+qn;r=await SB.from('lenses').update({qty:ex.qty}).eq('id',ex.id);if(bad(r))return}
  else{r=await SB.from('lenses').insert({type:a,sph:N(s),cyl:c===''?null:N(c),qty:qn,min:m}).select().single();if(bad(r))return;db.lenses.push(r.data)}}
 toast('Add ho gaya');stock()}
async function adj(id,n){var t=db.frames.some(function(z){return z.id==id})?'frames':'lenses',x=db[t].find(function(z){return z.id==id}),v=Math.max(0,N(x.qty)+n),r=await SB.from(t).update({qty:v}).eq('id',id);if(bad(r))return;x.qty=v;st2()}
async function rm(id){if(!confirm('Hata dein?'))return;var t=db.frames.some(function(z){return z.id==id})?'frames':'lenses',r=await SB.from(t).delete().eq('id',id);if(bad(r))return;db[t]=db[t].filter(function(z){return z.id!=id});st2()}
/* ---------- settings ---------- */
function more(){$('v').innerHTML='<div class="card"><b>Shop details (slip par aayengi)</b><input id="sp" placeholder="Shop ka naam" value="'+esc(db.set.shop)+'"><input id="sq" placeholder="Shop ka number" value="'+esc(db.set.phone)+'"><input id="sc" placeholder="Currency (Rs, $, AED...)" value="'+esc(db.set.currency)+'"><button data-c="setS()">Save</button></div>'
 +'<div class="card"><div class="m">Login: '+esc(U&&U.email)+'</div><p class="m">Aap ka data online mehfooz hai, kisi bhi phone par login karke khul jata hai.</p><button class="g" data-c="logout()">Logout</button></div>'}
async function setS(){var s={user_id:U.id,shop:$('sp').value||'My Optical Shop',phone:$('sq').value,currency:$('sc').value||'Rs'},r=await SB.from('settings').upsert(s);if(bad(r))return;db.set=Object.assign(db.set,s);toast('Save ho gaya');render()}
/* ---------- events ---------- */
function runA(el,attr){var a=el.getAttribute(attr),m=a&&a.match(/^(\w+)\((.*)\)$/);if(!m||typeof window[m[1]]!=='function')return;
 var args=m[2]===''?[]:m[2].split(',').map(function(x){x=x.trim();if(x==='this.value')return el.value;if(/^'.*'$/.test(x))return x.slice(1,-1);return Number(x)});window[m[1]].apply(null,args)}
document.addEventListener('click',function(e){var el=e.target;while(el&&el!==document){if(el.getAttribute&&el.getAttribute('data-c')){runA(el,'data-c');return}el=el.parentNode}});
document.addEventListener('input',function(e){var el=e.target;if(el.getAttribute&&el.getAttribute('data-i'))runA(el,'data-i')});
document.addEventListener('change',function(e){var el=e.target;if(el.getAttribute&&el.getAttribute('data-h'))runA(el,'data-h')});
boot();
</script></body></html>
