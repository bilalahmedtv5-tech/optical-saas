<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:150px}
header{background:var(--hd);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 26px;border-radius:0 0 26px 26px}
.hd{max-width:640px;margin:auto;display:flex;align-items:center;gap:12px}
.lg{display:inline-flex;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);align-items:center;justify-content:center;flex:none}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.stat span{display:block;color:var(--mut);font-size:12.5px;margin-bottom:4px}.stat b{display:block;font-size:20px;font-weight:800}.neg{color:var(--bad)}
.warn{background:var(--warnbg);border-color:transparent;color:var(--warn);margin-top:12px}
input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 6px}

label{font-size:12.5px;color:var(--mut);font-weight:600}

nav button{flex:1;background:none;color:var(--mut);border-radius:14px;padding:7px 4px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri);background:var(--soft)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;flex:none}
.tag{font-size:11.5px;padding:3px 10px;border-radius:20px;background:var(--soft);font-weight:700}
.tag.stOrdered{background:var(--warnbg);color:var(--warn)}.tag.stReady{background:var(--bluebg);color:var(--blue)}.tag.stDelivered{background:var(--okbg);color:var(--ok)}
.tag.low{background:var(--warnbg);color:var(--warn)}
table{width:100%;border-collapse:collapse;text-align:center}td,th{padding:3px}th{font-size:12px;color:var(--mut)}td input{text-align:center;padding:10px 2px}
.m{color:var(--mut);font-size:13px}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 40px;z-index:6;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet>div{max-width:640px;margin:auto}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.bar>*{flex:1}
.brand{text-align:center;padding:10px 0 4px}.brand .lg{width:64px;height:64px;border-radius:20px;background:var(--pri)}.brand .lg svg{width:40px;height:20px}
.brand h2{margin:14px 0 4px;font-size:22px}
#t{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:22px;z-index:9;display:none;max-width:90%;font-weight:600}

 $('v').innerHTML='<div class="brand"><div class="lg">'+LOGO+'</div><h2>Naya password rakhein</h2></div><div class="card"><label>Naya password (kam az kam 6 harf)</label><input id="np" type="password" autocomplete="new-password"><label>Dobara likhein</label><input id="np2" type="password" autocomplete="new-password"><div class="bar"><button data-c="setPw()">Password save karein</button></div></div>'}
async function setPw(){var a=$('np').value,b=$('np2').value;if(a.length<6)return toast('Password kam az kam 6 harf ka ho');if(a!==b)return toast('Dono password match nahi karte');
 var r=await SB.auth.updateUser({password:a});if(bad(r))return;recovering=false;history.replaceState(null,'',location.pathname);toast('Naya password lag gaya');boot()}
async function login(){var r=await SB.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(bad(r))return;boot()}
async function signup(){var shop=$('sh1').value.trim();if(!shop)return toast('Shop ka naam likhna zaroori hai');
 var r=await SB.auth.signUp({email:$('em').value.trim(),password:$('pw').value,options:{data:{shop:shop}}});if(bad(r))return;
 if(r.data.session)boot();else{toast('Email check karein, confirm link dabayein, phir Login karein');authUI('login')}}

async function load(){var r=await Promise.all([SB.from('orders').select('*').order('created_at'),SB.from('frames').select('*').order('created_at'),SB.from('lenses').select('*').order('created_at'),SB.from('settings').select('*').maybeSingle()]);
 if(bad(r[0])||bad(r[1])||bad(r[2]))return;
 db.orders=r[0].data.map(function(o,i){o.no=o.order_no||i+1;o.date=iso(new Date(o.created_at));o.ts=new Date(o.created_at).getTime();o.rx=o.rx||{R:{},L:{}};return o});
 db.frames=r[1].data;db.lenses=r[2].data;if(r[3].data)db.set=Object.assign(db.set,r[3].data);else{var sh=(U.user_metadata&&U.user_metadata.shop)||db.set.shop;db.set.shop=sh;await SB.from('settings').upsert({user_id:U.id,shop:sh,phone:'',currency:'Rs'})}await loadSub()}

var tabs=[['home','Dashboard'],['orders','Orders'],['stock','Stock'],['more','Settings']];
function nav(){$('nav').innerHTML=tabs.map(function(t){return '<button class="'+(tab==t[0]?'on':'')+'" data-c="go(\''+t[0]+'\')"><svg viewBox="0 0 24 24">'+IC[t[0]]+'</svg>'+t[1]+'</button>'}).join('')}
var sheetDepth=false;
function go(t){var was=tab;if(t=='home'&&was!='home'){history.back();return}if(t!='home'&&was=='home')history.pushState({t:1},'');tab=t;q='';render()}

function lowF(){return db.frames.filter(function(f){return N(f.qty)<=N(f.min)})}
function lowL(){return db.lenses.filter(function(l){return N(l.qty)<=N(l.min)})}

function render(){nav();$('sn').textContent=db.set.shop;$('today').textContent=new Date().toDateString();({home:home,orders:orders,stock:stock,more:more})[tab]()}
function home(){var td=iso(),mo=td.slice(0,7),O=db.orders,tS=0,mS=0,bal=0,ph={},tc=0;
 O.forEach(function(o){if(o.date==td){tS+=N(o.total);tc++}if(o.date.slice(0,7)==mo)mS+=N(o.total);bal+=N(o.total)-N(o.paid);ph[o.phone]=1});
 var lf=lowF(),ll=lowL(),nl=lf.length+ll.length,pend=O.filter(function(o){return o.status!='Delivered'});
 $('v').innerHTML='<div class="hero"><svg class="hg" viewBox="0 0 48 24"><circle cx="12" cy="12" r="9"/><circle cx="36" cy="12" r="9"/><path d="M21 11q3-3 6 0"/></svg><div class="hl">Aaj ki sale</div><div class="hn">'+rs(tS)+'</div><div class="hr"><div><b>'+tc+'</b><span>aaj ke customer</span></div><div><b>'+pend.length+'</b><span>pending orders</span></div></div></div>'
 +'<div class="grid"><div class="card stat"><span>Is mahine ki sale</span><b>'+rs(mS)+'</b></div><div class="card stat"><span>Baqaya (udhaar)</span><b class="'+(bal>0?'neg':'')+'">'+rs(bal)+'</b></div><div class="card stat"><span>Kul customers</span><b>'+Object.keys(ph).length+'</b></div><div class="card stat"><span>Low stock items</span><b class="'+(nl?'neg':'')+'">'+nl+'</b></div></div>'

 +planBar()+'<button class="fab" data-c="newOrder()">+ Naya order</button>'}
function orders(){$('v').innerHTML='<div class="row"><input placeholder="Naam ya number se dhundein" value="'+esc(q)+'" data-i="qo(this.value)"></div><div id="ol"></div><button class="fab" data-c="newOrder()">+ Naya order</button>';orders2()}
function qo(v){q=v;orders2()}function qs(v){q=v;st2()}function sg(v){seg=v;render()}
function orders2(){var s=q.toLowerCase(),L=db.orders.filter(function(o){return !s||(o.name+o.phone).toLowerCase().indexOf(s)>-1}).sort(function(a,b){return b.ts-a.ts});

function sheet(h){if(!sheetDepth){history.pushState({s:1},'');sheetDepth=true}$('sh').innerHTML='<div class="sheet"><div>'+h+'</div></div>'}

 sheet('<h3>'+(E?'Order edit karein':'Naya order')+'</h3><label>Naam</label><input id="n"><label>WhatsApp number (923001234567)</label><input id="p" inputmode="tel" data-i="fill()"><div id="hist" class="m"></div>'
